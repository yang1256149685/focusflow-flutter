name: Verify Flutter portfolio
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the recorded official SDK revision without third-party Actions.
      - run: git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
      - run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /focusflow-flutter/
